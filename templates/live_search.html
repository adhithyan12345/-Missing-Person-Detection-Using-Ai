{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">
            Live Surveillance
        </h2>
        <p class="mt-4 text-lg text-gray-500">
            Real-time face detection. Matches will be highlighted in <span
                class="text-green-600 font-bold">Green</span>.
        </p>


        <div class="mt-4">
            <button id="enableNotifyBtn" onclick="requestNotificationPermission()"
                class="text-sm text-indigo-600 hover:text-indigo-800 underline focus:outline-none">
                Enable Audio & Browser Notifications
            </button>
        </div>


        <audio id="alertSound"
            src="data:audio/mp3;base64,//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"
            preload="auto"></audio>


        <div class="mt-6 flex justify-center space-x-4">
            <button id="modeLocal"
                class="px-4 py-2 rounded-md bg-indigo-600 text-white font-medium hover:bg-indigo-700 focus:outline-none">
                Local Camera
            </button>
            <button id="modeCCTV"
                class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 font-medium hover:bg-gray-300 focus:outline-none">
                CCTV / IP Camera
            </button>
        </div>
    </div>


    <div id="sectionLocal" class="flex flex-col items-center">
        <div class="relative rounded-lg overflow-hidden shadow-xl bg-black" style="width: 640px; height: 480px;">
            <video id="videoElement" autoplay playsinline
                class="absolute top-0 left-0 w-full h-full object-cover"></video>
            <canvas id="overlayCanvas" width="640" height="480"
                class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>

            <div id="loadingMessage"
                class="absolute inset-0 flex items-center justify-center text-white bg-black bg-opacity-50 hidden">
                <span>Processing...</span>
            </div>


            <button onclick="toggleFullscreen(this.parentElement)"
                class="absolute bottom-4 right-4 p-2 bg-black bg-opacity-50 rounded-full text-white hover:bg-opacity-75 focus:outline-none"
                title="Fullscreen">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
            </button>
        </div>

        <div class="text-center mt-8">
            <button id="startBtn"
                class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Start Camera
            </button>
            <button id="stopBtn"
                class="hidden inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                Stop Camera
            </button>
            <p class="mt-4 text-sm text-gray-500">
                Note: You must allow camera access when prompted by your browser.
            </p>
        </div>
    </div>


    <div id="sectionCCTV" class="hidden flex-col items-center w-full">
        <div class="mb-8 max-w-xl w-full mx-auto">
            <div class="flex gap-4">
                <input type="text" id="videoSource"
                    placeholder="Enter CCTV URL (e.g. http://192.168.1.5:8080/video) or Camera Index (0)"
                    class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                <button onclick="addCamera()"
                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Add Camera
                </button>
            </div>
            <p class="mt-2 text-xs text-gray-500 text-center">Default is '0' (Server Webcam). For IP Cameras, use
                RTSP/HTTP URL.</p>
        </div>


        <div id="cctvGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full px-4">

        </div>
    </div>

    <script>
        // --- Geolocation ---
        let currentLat = null;
        let currentLon = null;

        function updateLocation_LiveSearch() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    console.log("Location updated:", currentLat, currentLon);
                }, error => {
                    console.error("Error getting location:", error);
                });
            } else {
                console.log("Geolocation is not supported by this browser.");
            }
        }

        // Update location immediately and periodically
        updateLocation_LiveSearch();
        setInterval(updateLocation_LiveSearch, 60000); // Every minute

        // --- Mode Switching ---
        const modeLocalBtn = document.getElementById('modeLocal');
        const modeCCTVBtn = document.getElementById('modeCCTV');
        const sectionLocal = document.getElementById('sectionLocal');
        const sectionCCTV = document.getElementById('sectionCCTV');

        modeLocalBtn.addEventListener('click', () => {
            sectionLocal.classList.remove('hidden');
            sectionLocal.classList.add('flex');
            sectionCCTV.classList.add('hidden');
            sectionCCTV.classList.remove('flex');

            modeLocalBtn.classList.add('bg-indigo-600', 'text-white');
            modeLocalBtn.classList.remove('bg-gray-200', 'text-gray-700');
            modeCCTVBtn.classList.remove('bg-indigo-600', 'text-white');
            modeCCTVBtn.classList.add('bg-gray-200', 'text-gray-700');
        });

        modeCCTVBtn.addEventListener('click', () => {
            sectionLocal.classList.add('hidden');
            sectionLocal.classList.remove('flex');
            sectionCCTV.classList.remove('hidden');
            sectionCCTV.classList.add('flex');

            modeCCTVBtn.classList.add('bg-indigo-600', 'text-white');
            modeCCTVBtn.classList.remove('bg-gray-200', 'text-gray-700');
            modeLocalBtn.classList.remove('bg-indigo-600', 'text-white');
            modeLocalBtn.classList.add('bg-gray-200', 'text-gray-700');

            // Stop local camera if running
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                isProcessing = false;
            }
        });

        // --- Local Camera Logic ---
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        let isProcessing = false;

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                startProcessing();
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Could not access camera. Please ensure you have granted permission. Note: If using another device, browsers block camera access on HTTP. Please use 'localhost' on the server machine.");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            isProcessing = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function startProcessing() {
            setInterval(async () => {
                if (!video.srcObject || isProcessing) return;
                isProcessing = true;

                // Draw video frame to a temporary canvas to get base64
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0);

                const imageData = tempCanvas.toDataURL('image/jpeg', 0.7);

                try {
                    const response = await fetch('/process_frame', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: imageData,
                            latitude: currentLat,
                            longitude: currentLon
                        })
                    });

                    const data = await response.json();

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }

                    if (data.results) {
                        data.results.forEach(result => {
                            const [x, y, w, h] = result.rect;
                            const color = result.color === 'green' ? '#059669' : '#DC2626';

                            if (result.name.startsWith("Found")) {
                                triggerAlert(result.name);
                            }

                            ctx.strokeStyle = color;
                            ctx.lineWidth = 3;
                            ctx.strokeRect(x, y, w, h);

                            ctx.fillStyle = color;
                            ctx.font = 'bold 18px sans-serif';
                            ctx.fillText(result.name, x, y - 10);
                        });
                    }
                } catch (err) {
                    console.error("Error processing frame:", err);
                } finally {
                    isProcessing = false;
                }
            }, 200);
        }

        // --- CCTV Logic (Multiple Cameras) ---
        function addCamera() {
            const sourceInput = document.getElementById('videoSource');
            const source = sourceInput.value.trim();

            if (!source) {
                alert("Please enter a valid source (URL or Index)");
                return;
            }

            const grid = document.getElementById('cctvGrid');
            const baseUrl = "{{ url_for('video_feed') }}";
            let feedUrl = `${baseUrl}?source=${encodeURIComponent(source)}&t=${new Date().getTime()}`;

            if (currentLat && currentLon) {
                feedUrl += `&latitude=${currentLat}&longitude=${currentLon}`;
            }

            const card = document.createElement('div');
            card.className = "bg-white rounded-lg shadow-lg overflow-hidden relative";
            card.innerHTML = `
                <div class="relative bg-black aspect-w-4 aspect-h-3">
                    <img src="${feedUrl}" alt="Camera Feed ${source}" class="w-full h-full object-contain">
                    <div class="absolute top-2 right-2">
                        <span class="flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                    </div>
                    <button onclick="toggleFullscreen(this.parentElement)" 
                            class="absolute bottom-2 right-2 p-1.5 bg-black bg-opacity-50 rounded-full text-white hover:bg-opacity-75 focus:outline-none"
                            title="Fullscreen">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                        </svg>
                    </button>
                </div>
                <div class="p-4 flex justify-between items-center bg-gray-50">
                    <span class="font-medium text-gray-700 truncate" title="${source}">Source: ${source}</span>
                    <button onclick="removeCamera(this)" class="text-red-600 hover:text-red-800 text-sm font-medium">
                        Remove
                    </button>
                </div>
            `;

            grid.appendChild(card);
            sourceInput.value = ''; // Clear input
        }

        function removeCamera(btn) {
            const card = btn.closest('div.bg-white');
            if (card) {
                // Clear src to stop stream
                const img = card.querySelector('img');
                if (img) img.src = "";
                card.remove();
            }
        }

        function toggleFullscreen(element) {
            if (!document.fullscreenElement) {
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) { /* Firefox */
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) { /* IE/Edge */
                    element.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) { /* Firefox */
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) { /* Chrome, Safari and Opera */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE/Edge */
                    document.msExitFullscreen();
                }
            }
        }

        // --- Notification Logic ---
        const alertSound = document.getElementById('alertSound');
        let lastAlertTime = 0;
        const ALERT_COOLDOWN = 5000; // 5 seconds

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notification");
            } else if (Notification.permission === "granted") {
                alert("Notifications already enabled!");
                // Test sound
                alertSound.play().catch(e => console.log("Audio play failed:", e));
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") {
                        alert("Notifications enabled!");
                        alertSound.play().catch(e => console.log("Audio play failed:", e));
                    }
                });
            }
        }

        function triggerAlert(name) {
            const now = Date.now();
            if (now - lastAlertTime > ALERT_COOLDOWN) {
                // Play Sound
                alertSound.play().catch(e => console.log("Audio play failed:", e));

                // Show Notification
                if (Notification.permission === "granted") {
                    new Notification("Missing Person Found!", {
                        body: `Match detected: ${name}`,
                        icon: '/static/icons/alert.png' // Optional
                    });
                }
                lastAlertTime = now;
            }
        }

        // Polling for CCTV Alerts
        setInterval(async () => {
            try {
                const response = await fetch('/check_alerts');
                const data = await response.json();
                if (data.alert) {
                    triggerAlert(data.name);
                }
            } catch (e) {
                console.error("Error checking alerts:", e);
            }
        }, 1000); // Check every second

    </script>
</div>
{% endblock %}
