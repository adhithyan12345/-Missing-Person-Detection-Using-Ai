{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
            Join the Volunteer Network
        </h2>
        <p class="mt-2 text-center text-sm text-gray-400">
            Help find missing persons in your area.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-gray-800 py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-700">
            <form class="space-y-6" action="{{ url_for('volunteer_signup') }}" method="POST">
                <div>
                    <label for="full_name" class="block text-sm font-medium text-gray-300">
                        Full Name
                    </label>
                    <div class="mt-1">
                        <input id="full_name" name="full_name" type="text" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-gray-700 text-white">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">
                        Email address
                    </label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-gray-700 text-white">
                    </div>
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-300">
                        Phone Number
                    </label>
                    <div class="mt-1">
                        <input id="phone" name="phone" type="text" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-gray-700 text-white">
                    </div>
                </div>

                <div>
                    <label for="location" class="block text-sm font-medium text-gray-300">
                        City / Location
                    </label>
                    <div class="mt-1">
                        <input id="location" name="location" type="text" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-gray-700 text-white">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300">
                        Password
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-gray-700 text-white">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Register as Volunteer
                    </button>
                </div>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-600"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-gray-800 text-gray-400">
                            Already registered?
                        </span>
                    </div>
                </div>

                <div class="mt-6 text-center">
                    <a href="{{ url_for('volunteer_login') }}"
                        class="font-medium text-indigo-400 hover:text-indigo-300">
                        Log in here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
