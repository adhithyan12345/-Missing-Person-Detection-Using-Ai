{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none">
        <div class="absolute top-1/4 -left-20 w-80 h-80 bg-indigo-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-purple-600/10 rounded-full blur-[100px]"></div>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
        <div class="flex justify-center mb-6">
            <div
                class="h-16 w-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white shadow-2xl">
                <i class="fas fa-id-badge text-3xl"></i>
            </div>
        </div>
        <h2 class="text-center text-4xl font-black text-white tracking-tighter">
            JOIN THE <span
                class="text-indigo-500 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500">FORCE</span>
        </h2>
        <p class="mt-2 text-center text-sm text-gray-500 font-medium uppercase tracking-widest">
            Become a verified FindHope volunteer
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
        <div
            class="bg-gray-800/80 backdrop-blur-xl py-10 px-6 shadow-2xl sm:rounded-3xl sm:px-12 border border-white/10">
            <form class="space-y-5" action="{{ url_for('volunteer_signup') }}" method="POST">
                <div class="space-y-1">
                    <label for="full_name"
                        class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">
                        Full Identification Name
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i
                                class="fas fa-user text-gray-600 group-focus-within:text-indigo-500 transition-colors"></i>
                        </div>
                        <input id="full_name" name="full_name" type="text" required placeholder="John Doe"
                            class="block w-full pl-10 pr-3 py-3 bg-black/30 border border-white/5 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="email"
                            class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">
                            Secure Email
                        </label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i
                                    class="fas fa-envelope text-gray-600 group-focus-within:text-indigo-500 transition-colors"></i>
                            </div>
                            <input id="email" name="email" type="email" required placeholder="name@email.com"
                                class="block w-full pl-10 pr-3 py-3 bg-black/30 border border-white/5 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label for="phone"
                            class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">
                            Comm. Number
                        </label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i
                                    class="fas fa-phone text-gray-600 group-focus-within:text-indigo-500 transition-colors"></i>
                            </div>
                            <input id="phone" name="phone" type="text" required placeholder="+1 234 567"
                                class="block w-full pl-10 pr-3 py-3 bg-black/30 border border-white/5 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm">
                        </div>
                    </div>
                </div>

                <div class="space-y-1">
                    <label for="location"
                        class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">
                        Deployment Zone (City)
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i
                                class="fas fa-map-marker-alt text-gray-600 group-focus-within:text-indigo-500 transition-colors"></i>
                        </div>
                        <input id="location" name="location" type="text" required placeholder="New York, NY"
                            class="block w-full pl-10 pr-3 py-3 bg-black/30 border border-white/5 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm">
                    </div>
                </div>

                <div class="space-y-1">
                    <label for="password"
                        class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">
                        Access Credentials
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i
                                class="fas fa-lock text-gray-600 group-focus-within:text-indigo-500 transition-colors"></i>
                        </div>
                        <input id="password" name="password" type="password" required placeholder="••••••••"
                            class="block w-full pl-10 pr-3 py-3 bg-black/30 border border-white/5 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full flex justify-center py-4 px-4 border border-transparent rounded-2xl shadow-xl text-sm font-black text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                        INITIALIZE VOLUNTEER ACCOUNT
                    </button>
                </div>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 flex flex-col items-center">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-4">Already in the network?</p>
                <a href="{{ url_for('volunteer_login') }}"
                    class="text-indigo-400 hover:text-indigo-300 font-black text-sm transition-colors flex items-center gap-2 group">
                    ACCESS LOGIN PORTAL <i
                        class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
