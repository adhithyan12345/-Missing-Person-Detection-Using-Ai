<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Case - Finding Missing Persons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{{ url_for('index') }}" class="text-2xl font-bold text-indigo-600">FindThem</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('index') }}" class="text-gray-600 hover:text-indigo-600 font-medium">Home</a>
                    <a href="{{ url_for('track') }}" class="text-gray-600 hover:text-indigo-600 font-medium">Track
                        Case</a>
                </div>
            </div>
        </div>
    </nav>

    
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <div class="mb-8">
            <a href="{{ url_for('case_status', ticket_id=case.ticket_id) }}"
                class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Case Status
            </a>
            <h1 class="text-3xl font-bold text-gray-900 mt-4">Edit Case Details</h1>
            <p class="text-gray-500 mt-2">Update the information for this missing person case.</p>
        </div>

        <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8">

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded text-red-700">
                <ul class="list-disc list-inside">
                    {% for message in messages %}
                    <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('edit_case', case_id=case.id) }}" method="POST" class="space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" name="full_name" value="{{ case.full_name }}" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>

                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select name="status"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                            <option value="Missing" {% if case.status=='Missing' %}selected{% endif %}>Missing</option>
                            <option value="Found" {% if case.status=='Found' %}selected{% endif %}>Found</option>
                            <option value="Deceased" {% if case.status=='Deceased' %}selected{% endif %}>Deceased
                            </option>
                        </select>
                    </div>

                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                        <input type="number" name="age" value="{{ case.age }}" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>

                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                        <select name="gender"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                            <option value="Male" {% if case.gender=='Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if case.gender=='Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if case.gender=='Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Seen Date</label>
                        <input type="date" name="last_seen_date" value="{{ case.last_seen_date }}" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>

                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contact Phone</label>
                        <input type="tel" name="contact_phone" value="{{ case.contact_phone }}" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>
                </div>

                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Seen Location</label>
                    <input type="text" name="last_seen_location" value="{{ case.last_seen_location }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>

                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="4" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition">{{ case.description }}</textarea>
                </div>

                <div class="flex items-center justify-end space-x-4 pt-4 border-t border-gray-100">
                    <a href="{{ url_for('case_status', ticket_id=case.ticket_id) }}"
                        class="text-gray-600 hover:text-gray-800 font-medium">Cancel</a>
                    <button type="submit"
                        class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 font-medium shadow-lg shadow-indigo-200 transition transform hover:-translate-y-0.5">
                        Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>

</body>

</html>
